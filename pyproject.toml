[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railguard-cv"
version = "0.1.0"
description = "RailEye3D railway platform safety-zone analysis for CS406"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "PyYAML>=6.0,<7",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
railguard = "railguard.cli:main"

[tool.setuptools.packages.find]
include = ["railguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
